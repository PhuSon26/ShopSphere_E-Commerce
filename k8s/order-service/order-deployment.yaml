apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-deployment
  namespace: nt533-web-ecommerce
  labels:
    app: order-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: order-deployment
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: order-deployment
    spec:
      containers:
        - name: order-service
          image: hoaanhuynh/nt533:shopsphere-order-service
          imagePullPolicy: Always
          ports:
            - containerPort: 8083
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql-service:3306/order_db
          envFrom:
            - configMapRef:
                name: port-url-configmap
            - secretRef:
                name: mysql-secret
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi