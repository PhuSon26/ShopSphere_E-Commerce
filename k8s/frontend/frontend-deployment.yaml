apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: nt533-web-ecommerce
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: hoaanhuynh/nt533:shopsphere-frontend
          imagePullPolicy: Always
          ports:
            - name: tcp
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1028Mi