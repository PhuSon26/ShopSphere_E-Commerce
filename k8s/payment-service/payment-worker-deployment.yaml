apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-worker-deployment
  namespace: nt533-web-ecommerce
  labels:
    app: payment-worker-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-worker-deployment
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: payment-worker-deployment
    spec:
      containers:
        - name: payment-worker-service
          image: hoaanhuynh/nt533:worker
          imagePullPolicy: Always
          env:
            - name: PAYMENT_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: port-url-configmap
                  key: PAYMENT_DB_URL
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: payment-db-credentials
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payment-db-credentials
                  key: SPRING_DATASOURCE_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi