apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api-deployment
  namespace: nt533-web-ecommerce
  labels:
    app: payment-api-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: payment-api-deployment
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: payment-api-deployment
    spec:
      containers:
        - name: payment-api-service
          image: hoaanhuynh/nt533:api
          imagePullPolicy: Always
          ports:
            - name: tcp
              containerPort: 8084
          env:
            - name: SERVER_PORT
              value: "8084"
            - name: PAYMENT_DB_URL
              valueFrom:
                configMapKeyRef:
                  name: port-url-configmap
                  key: PAYMENT_DB_URL
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql-service:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC"
          envFrom:
            - secretRef:
                name: payment-db-credentials
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi