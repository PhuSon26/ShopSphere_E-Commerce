apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: nt533-web-ecommerce
spec:
  ingressClassName: nginx
  rules:
    - host: nt533-ecommerce.uit.vn
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 8080