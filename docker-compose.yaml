services:
  
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - product-service
      - order-service
    ports:
      - "80:80"
    networks:
      - shop-network
    
  auth-service:
    build:
      context: ./Auth_Service
      dockerfile: Dockerfile
    container_name: shop-auth-service
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - AUTH_SERVICE_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/auth_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=sonnak123
    ports:
      - "8081:8081"
    networks:
      - shop-network

  product-service:
    build:
      context: ./Product_Service
      dockerfile: Dockerfile
    container_name: shop-product-service
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - PRODUCT_SERVICE_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/product_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=sonnak123
    ports:
      - "8082:8082"
    networks:
      - shop-network

  order-service:
    build:
      context: ./Order_Service
      dockerfile: Dockerfile
    container_name: shop-order-service
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - ORDER_SERVICE_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql:3306/order_db
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=sonnak123
    ports:
      - "8083:8083"
    networks:
      - shop-network

  payment-service:
    build:
      context: ./Payment_service
      dockerfile: Dockerfile
    container_name: shop-payment-service
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      APP_ROLE: api
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      PAYMENT_GATEWAY: ${PAYMENT_GATEWAY:-mock}
      MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
      MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
      MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
      MOMO_ENDPOINT: ${MOMO_ENDPOINT:-https://test-payment.momo.vn/v2/gateway/api/create}
      MOMO_REDIRECT_URL: ${MOMO_REDIRECT_URL:-http://localhost:3000/payment-result}
      MOMO_IPN_URL: ${MOMO_IPN_URL:-http://localhost/api/payments/v1/payments/momo/ipn}
    ports:
      - "8084:8084"
    networks:
      - shop-network
      
  mysql:
    image: mysql:8.0
    container_name: shop-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sonnak123 
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shop-network

volumes:
  mysql_data:

networks:
  shop-network:
    driver: bridge