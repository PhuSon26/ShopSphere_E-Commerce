services:
  
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: shop-frontend
    restart: unless-stopped
    depends_on:
      - auth-service
      - product-service
      - order-service
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - shop-network
    
  auth-service:
    build:
      context: ./Auth_Service
      dockerfile: Dockerfile
    container_name: shop-auth-service
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - AUTH_SERVICE_PORT=${AUTH_SERVICE_PORT}
      - SPRING_DATASOURCE_URL=${AUTH_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD}        
    ports:
      - "${AUTH_SERVICE_PORT}:8081"
    networks:
      - shop-network

  product-service:
    build:
      context: ./Product_Service
      dockerfile: Dockerfile
    container_name: shop-product-service
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - PRODUCT_SERVICE_PORT=${PRODUCT_SERVICE_PORT}
      - SPRING_DATASOURCE_URL=${PRODUCT_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD} 
    ports:
      - "${PRODUCT_SERVICE_PORT}:8082"
    networks:
      - shop-network

  order-service:
    build:
      context: ./Order_Service
      dockerfile: Dockerfile
    container_name: shop-order-service
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      - ORDER_SERVICE_PORT=${ORDER_SERVICE_PORT}
      - SPRING_DATASOURCE_URL=${ORDER_DB_URL}
      - SPRING_DATASOURCE_USERNAME=${MYSQL_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${MYSQL_ROOT_PASSWORD} 
    ports:
      - "${ORDER_SERVICE_PORT}:8083"
    networks:
      - shop-network

  mysql:
    image: mysql:8.0
    container_name: shop-mysql-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD} 
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shop-network

volumes:
  mysql_data:

networks:
  shop-network:
    driver: bridge